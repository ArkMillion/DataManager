name: datamanager-test

services:
  mysql:
    image: mysql:8.0
    container_name: datamanager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dm_root_pwd
      MYSQL_DATABASE: all_test
      MYSQL_USER: all_test
      MYSQL_PASSWORD: all_test
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdm_root_pwd"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.0.0
    container_name: datamanager-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "dm_redis_pwd"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dm_redis_pwd", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:7.0
    container_name: datamanager-mongodb
    environment:
      MONGO_INITDB_DATABASE: test
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    container_name: datamanager-postgres
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: dm_pg_pwd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: bitnamilegacy/kafka:3.5.1
    container_name: datamanager-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: datamanager-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dm_rabbit
      RABBITMQ_DEFAULT_PASS: dm_rabbit_pwd
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  mongo-data:
  postgres-data:
