name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & Test
        run: mvn -B -ntp verify

      - name: Validate tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: '$TAG'. Expected pattern vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Check POM version matches tag
        run: |
          POM_VERSION=$(mvn -B -q org.apache.maven.plugins:maven-help-plugin:3.4.0:evaluate -Dexpression=project.version -DforceStdout)
          echo "POM version: $POM_VERSION, tag version: ${{ steps.tag.outputs.version }}"
          if [[ "$POM_VERSION" != "${{ steps.tag.outputs.version }}" ]]; then
            echo "POM version '$POM_VERSION' does not match tag 'v${{ steps.tag.outputs.version }}'. Update pom.xml, commit, then re-tag."
            exit 1
          fi

      - name: Ensure release is not already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.tag.outputs.tag }} already exists. Published releases are immutable; push a new tag (e.g. v1.0.1)."
            exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir staging
          for jar in */target/*.jar; do
            case "$jar" in
              datamanager-examples/*|*sources*|*javadoc*) continue ;;
              *) cp "$jar" staging/ ;;
            esac
          done
          ls -l staging/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "v${{ steps.tag.outputs.version }}" \
            --generate-notes \
            staging/*.jar
